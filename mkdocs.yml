site_name: DivineRPG Extended
site_url: https://keeg4n.github.io/DivineRPG-extended-guide/
site_description: Гайд по аддону DivineRPG Extended для Minecraft 1.7.10 - прохождение, боссы, миры, мобы, предметы и механики
repo_url: https://github.com/Keeg4n/DivineRPG-extended
repo_name: DivineRPG-extended
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    scheme: default
    primary: deep-purple
    accent: amber
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/extra.css
  - assets/editor.css

extra_javascript:
  - assets/editor.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

